spring:
  application:
    name: x-mcp-client
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-opus-4-8
    mcp:
      client:
        enabled: true
        name: xmcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        # Demo 1: the X docs MCP server is a plain remote endpoint. No auth, no bridge.
        streamable-http:
          connections:
            x-docs:
              url: https://docs.x.com   # -> https://docs.x.com/mcp
            # Demo 2 (live X API): same streamable-http transport, bearer auth added by
            # XApiAuthConfig for this connection only. Needs X_BEARER_TOKEN set as an
            # environment variable (never put a real token in this file). Read the auth
            # caveat in XApiAuthConfig / the README before assuming this authenticates
            # successfully against api.x.com.
            x-api:
              url: https://api.x.com    # -> https://api.x.com/mcp

logging:
  level:
    com.omar: INFO
    org.springframework.ai: INFO
    # Logs "Executing tool call: <name>" for each tool the model invokes
    org.springframework.ai.model.tool.DefaultToolCallingManager: DEBUG
